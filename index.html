<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Bancaria</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white w-87.5 p-8 rounded-2xl shadow-xl">

    <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">
      Cuenta Bancaria
    </h1>

    <div class="text-center mb-6">
      <p class="text-gray-500 text-sm">Saldo Disponible</p>

      <h2 id="saldo"
          class="text-4xl font-bold text-green-600 mt-2">
        $0
      </h2>
    </div>

    <input
      type="number"
      id="monto"
      placeholder="Ingrese un monto"
      class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
    >

    <div class="grid grid-cols-1 gap-3 mt-6">

      <button
        onclick="depositar()"
        class="bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold transition"
      >
        Depositar
      </button>

      <button
        onclick="retirar()"
        class="bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-semibold transition"
      >
        Retirar
      </button>

      <button
        onclick="consultarSaldo()"
        class="bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-semibold transition"
      >
        Consultar Saldo
      </button>

    </div>

    <div
      id="mensaje"
      class="mt-6 text-center font-semibold text-slate-700"
    >
    </div>

  </div>

  <script src="practica_calificada6.js"></script>

</body>
</html>
